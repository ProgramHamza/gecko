# Developmental LM configuration.
# A run copies this file into runs/<run_name>/config.yaml at `init`; later commands
# use that copy, so you can edit it there to change settings in the middle of a run.

run_name: first-child
runs_dir: runs
seed: 1234

child:
  model_name: roneneldan/TinyStories-33M      # any small Hugging Face causal LM
  tokenizer_name: EleutherAI/gpt-neo-125M     # TinyStories models use the GPT-Neo tokenizer
  device: auto                                # auto | cuda | cpu
  max_length: 256
  generation_tokens: 40
  temperature: 0.8

growth:
  enabled: true            # reserve one zero-initialised module per layer
  bottleneck: 64           # size of each module
  order: top_down          # which layer gets the first module
  grow_loss_threshold: 2.0 # grow when new memories are still this surprising after sleep
  min_days_between_growth: 3

sleep:
  train_mode: full         # full = rewrite all weights | growth_only = only grown modules | base_only
  learning_rate: 3.0e-5
  growth_learning_rate: 1.0e-3
  epochs: 3
  batch_size: 8
  max_items: 160           # cap on texts trained per night
  replay_ratio: 0.5        # old memories per new memory
  rehearsal_ratio: 0.3     # day-0 stories per new memory (protects its language)
  rehearsal_pool: 200
  surprise_quantile: 0.5   # only observations above this surprise quantile are consolidated
  autobiographical: true   # remember "On day N, I learned that ..."
  grad_clip: 1.0

world:
  seed: 7
  starting_creatures: 3
  arrival_days: [8, 16, 24]   # new creatures arrive: early / middle / late (learning-to-learn test)
  rules_per_creature: 2
  observations_per_day: 10
  noise_ratio: 0.2            # share of events that happen for no reason

curiosity:
  strategy: learning_progress  # learning_progress | surprise | random
  questions_per_day: 4
  window: 3

teacher:
  backend: ollama              # ollama (local, free) | anthropic (Claude API) | scripted (no LLM)
  model: llama3.1:8b           # Ollama model name
  anthropic_model: claude-opus-5-5
  ollama_url: http://localhost:11434
  max_words: 40
  lessons_per_day: 1
  timeout_seconds: 120
  effort: low                  # Claude only: low | medium | high | xhigh | max

probes:
  metacog_lags: [1, 3, 5]      # "did I know this 1 / 3 / 5 days ago?"
  milestone_variants: 3

snapshots:
  keep_every: 1                # 1 = keep every day's weights (~130 MB each); 5 = every 5th day
